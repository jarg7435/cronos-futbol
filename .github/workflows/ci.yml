name: CI

# Integración continua de CHRONOS FÚTBOL.
# Corre en cada push y pull_request a CUALQUIER rama.
#   - install (npm ci: instalación limpia desde el lock)
#   - build   (scripts/build.js: sintaxis, recursos, precache, versiones)
#   - lint    (eslint.config.js: los ERRORES cortan, los avisos no)
#   - test    (scripts/run-tests.js: falla si cualquier test falla)
# No requiere emulador ni secretos: los tests son puros de Node.
#
# ⚠️ v758 (reauditoría 23-09): el lint era «best-effort, no bloquea» y llevaba
# sin arrancar desde el paso a ESLint 9 (sólo existía .eslintrc.json). Nadie lo
# notó porque no cortaba nada. Su primera pasada real encontró seis
# ReferenceError vivos en producción. Ahora es un paso más de la puerta.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Build + Lint + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      # Reauditoría 19-10: repetir la auditoría en cada cambio y cortar con
      # vulnerabilidades altas o críticas en lo que llega a producción.
      - name: Audit runtime dependencies (gate)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit functions dependencies (gate)
        run: npm audit --omit=dev --audit-level=high
        working-directory: functions

      - name: Build (gate)
        run: npm run build

      - name: Lint (gate)
        run: npm run lint

      - name: Test suite (gate)
        run: npm test
